name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git user
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Sync master + stable tags only
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/paperclipai/paperclip.git

          # Master tip (for compose builds) — do not fetch channel tags.
          git fetch upstream master
          # Stable CalVer only: vYYYY.MDD.P (skips canary/, nightly/, beta/, paperclipai@*)
          git fetch upstream 'refs/tags/v*:refs/tags/v*'

          git checkout master
          git merge upstream/master --no-edit
          git push origin master

          # Push only exact stable tags (v1.2.3 / v2026.916.0). Dokploy "On Tag"
          # has no name filter — any pushed tag would redeploy.
          pushed=0
          skipped=0
          while IFS= read -r tag; do
            if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              git push origin "refs/tags/${tag}"
              echo "Pushed stable tag ${tag}"
              pushed=$((pushed + 1))
            else
              echo "Skipping non-stable tag ${tag}"
              skipped=$((skipped + 1))
            fi
          done < <(git tag -l 'v*')
          echo "Stable tags pushed: ${pushed}; skipped: ${skipped}"

      - name: Mirror upstream GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        shell: bash
        run: |
          set +e
          # Upstream only creates GitHub Releases for stables — still guard the pattern.
          gh release list --repo paperclipai/paperclip --limit 20 --json tagName -q '.[].tagName' > /tmp/tags.txt
          cat /tmp/tags.txt
          while read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Skipping non-stable release tag $tag"
              continue
            fi
            gh release view "$tag" --repo ${{ github.repository }} >/dev/null 2>&1
            exists=$?
            if [ "$exists" -ne 0 ]; then
              title=$(gh release view "$tag" --repo paperclipai/paperclip --json name -q .name)
              notes=$(gh release view "$tag" --repo paperclipai/paperclip --json body -q .body)
              gh release create "$tag" --repo ${{ github.repository }} --title "$title" --notes "$notes"
              echo "Created release $tag"
            else
              echo "Release $tag already exists, skipping"
            fi
          done < /tmp/tags.txt
          exit 0
